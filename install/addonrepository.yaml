# A Supervisor administrator applies this once. The VKS addon manager reads
# the chart from the helm repository and creates the Addon
# platform-observability and an AddonRelease for each version in addonFilters.
# The chart ships its own AddonConfigDefinition (an annotation in Chart.yaml,
# read by VKS 3.8 and later), which takes the credentials from the Secret
# platform-observability-<cluster>.
#
# After the AddonRepositoryInstall exists, the webhook allows only
# spec.addonFilters to change. To offer a new chart version, add it to
# addonFilters (and keep the old one while clusters still use it).
#
# The package-offerings annotation is required, and it cannot change after
# install, so it lists no versions.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepository
metadata:
  name: platform-observability-oci-repo
  namespace: vmware-system-vks-public
  annotations:
    addons.kubernetes.vmware.com/package-offerings: |
      {"repositoryVersion":"2.0.0","packages":{"platform-observability":{"versions":[]}}}
spec:
  fetch:
    helmRepository:
      url: oci://ghcr.io/warroyo/platform-observability-addon/charts
  addonFilters:
    - name: platform-observability
      versions: ["0.3.1"]
  targetRepositoryName: platform-observability-oci-repo
  version: "2.0.0"
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepositoryInstall
metadata:
  name: platform-observability-oci-repo-install
  namespace: vmware-system-vks-public
spec:
  addonRepositoryRef:
    name: platform-observability-oci-repo
    namespace: vmware-system-vks-public
