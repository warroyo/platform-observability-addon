# Publishes the chart as an OCI artifact on GitHub Packages:
#   oci://ghcr.io/warroyo/platform-observability-addon/charts/platform-observability
# which is what the AddonRepository fetches. A push to main that bumps the
# version in chart/platform-observability/Chart.yaml releases that version. A
# version that is already published is skipped, never overwritten. Each
# version also gets a GitHub release, platform-observability-<version>, which
# the README's chart badge reads.
name: release

on:
  push:
    branches: [main]
    paths: ["chart/**", "scripts/embed-acd.sh"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: oci://ghcr.io/warroyo/platform-observability-addon/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the embedded AddonConfigDefinition is current
        run: scripts/embed-acd.sh --check
      - uses: azure/setup-helm@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package and push, unless this version is already published
        working-directory: chart/platform-observability
        run: |
          version=$(yq '.version' Chart.yaml)
          if helm show chart "$REGISTRY/platform-observability" --version "$version" >/dev/null 2>&1; then
            echo "platform-observability $version is already published; skipping"
            exit 0
          fi
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build
          helm package . -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/platform-observability-$version.tgz" "$REGISTRY"
          echo "Published $REGISTRY/platform-observability:$version" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub release for this version, if there is none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(yq '.version' chart/platform-observability/Chart.yaml)
          tag="platform-observability-$version"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Chart \`oci://ghcr.io/warroyo/platform-observability-addon/charts/platform-observability\` version $version."
