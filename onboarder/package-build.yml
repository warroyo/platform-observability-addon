apiVersion: kctrl.carvel.dev/v1alpha1
kind: PackageBuild
metadata:
  name: platform-observability-onboarder.field.vmware.com
spec:
  release:
  - resource: {}
  template:
    spec:
      app:
        spec:
          deploy:
          - kapp: {}
          template:
          - ytt:
              paths:
              - config
          - kbld: {}
      export:
      - imgpkgBundle:
          image: ghcr.io/warroyo/platform-observability-addon/onboarder-bundle
          useKbldImagesLock: true
        includePaths:
        - config
