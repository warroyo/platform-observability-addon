apiVersion: v2
name: platform-observability
description: >-
  Ships a VKS cluster's metrics, events and logs to VCF Operations Platform
  Observability (Extensions > Platform Observability). The same install as the
  VCF Operations "Onboard VKS Cluster" dialog, as one chart.
type: application
home: https://github.com/warroyo/platform-observability-addon
sources:
  - https://github.com/warroyo/platform-observability-addon
  - https://github.com/open-telemetry/opentelemetry-helm-charts
version: 0.2.0
# The collector image the VCF Operations values pin.
appVersion: "0.153.0"
dependencies:
  # Two releases of the same chart, as the onboarding dialog installs them.
  - name: opentelemetry-collector
    alias: aggregator
    version: 0.158.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: enabled
  - name: opentelemetry-collector
    alias: agent
    version: 0.158.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: enabled
# The AddonConfigDefinition, from chart/addon-config-definition.yaml. Written
# by scripts/embed-acd.sh; keep this block last.
annotations:
  addons.kubernetes.vmware.com/addon-config-definition: 
