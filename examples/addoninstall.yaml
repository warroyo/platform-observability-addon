# Attach the addon to every cluster in this Supervisor namespace that carries
# the label addons.kubernetes.vmware.com/platform-observability=enabled.
#
# Each matched cluster also needs the Secret platform-observability-<cluster>
# with its VCF Operations credentials: the onboarder writes it, or run
# scripts/onboard.sh for it. Until it exists the addon installs nothing.
#
# The chart is a helm addon, so the cluster also needs the helm-controller
# addon: label it addon.addons.kubernetes.vmware.com/helm-controller=managed
# if it does not have helm-controller already.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: platform-observability-addoninstall
  namespace: my-namespace
spec:
  addonRef:
    name: platform-observability
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/platform-observability: enabled
  releaseFilter:
    ref:
      name: platform-observability.0.3.0
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
